services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /app/storage/framework
      - /app/storage/logs
    security_opt:
      - no-new-privileges:true
