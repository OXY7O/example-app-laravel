{
  "name": "Validate Demo Repository",
  "on": {
    "pull_request": {},
    "push": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate-demo-repository": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Checkout source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "name": "Configure Node.js",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24",
            "cache": "npm"
          }
        },
        {
          "name": "Configure PHP",
          "uses": "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962",
          "with": {
            "php-version": "8.3",
            "tools": "composer",
            "coverage": "xdebug"
          }
        },
        {
          "name": "Install repository validation dependencies",
          "run": "npm ci"
        },
        {
          "name": "Validate repository contracts",
          "run": "npm test"
        },
        {
          "name": "Validate Composer metadata",
          "run": "composer validate --strict"
        },
        {
          "name": "Install frozen PHP dependencies",
          "run": "composer install --no-interaction --no-progress"
        },
        {
          "name": "Run application tests and coverage gate",
          "run": "composer run test:phpunit"
        },
        {
          "name": "Run repository validator",
          "run": "node scripts/validate-repository.mjs"
        }
      ]
    }
  }
}
